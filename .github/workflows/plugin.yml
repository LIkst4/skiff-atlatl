# SPDX-License-Identifier: GPL-3.0-only
# (custom) ATLATL FM-1, the FM-1 plugin (plugin/): CLAP, VST3, AUv2 (macOS) and a standalone app, on Windows, macOS (universal) and
# Linux; the link's tests, clap-validator on the CLAP, pluginval on the VST3, auval on the AU, a look at the window
# (Linux, Xvfb). The plugins are this run's artifacts: a zip each, and an installer each (a .pkg for macOS, a setup .exe
# for Windows, a .tar.gz with install.sh for Linux). A tag vX.Y (or VX.Y.Z), or a run asked for with a release's tag,
# builds that tag's source and attaches them to its release, beside the firmware (build.yml).
name: plugin
on:
  workflow_dispatch:
    inputs:
      release:
        description: "a release's tag (vX.Y, VX.Y.Z): build its source and attach the plugin's installers to it"
        required: false
        default: ""
  push:
    branches: ["**"]
    tags: ["v*", "V*"]            # (tags: every one, whatever changed; branches: the paths below)
    paths:
      - "plugin/**"
      - "web/editor.html"
      - "web/fm1backup.js"
      - "web/conv/conv.js"
      - ".github/workflows/plugin.yml"
permissions:
  contents: read
concurrency:
  group: plugin-${{ inputs.release || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
          - os: macos-15
            name: macos
          - os: windows-2022
            name: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release || github.ref }}
      - name: "Linux: GTK, WebKitGTK, ALSA, Xvfb"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev xvfb imagemagick ninja-build
      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S plugin -B build/plugin -G "Visual Studio 17 2022" -A x64
          else
            gen=Ninja; [ "$RUNNER_OS" = "macOS" ] && gen="Unix Makefiles"
            cmake -S plugin -B build/plugin -G "$gen" -DCMAKE_BUILD_TYPE=Release
          fi
      - name: Build
        run: cmake --build build/plugin --config Release --parallel 4
      - name: "The link's tests"
        run: ctest --test-dir build/plugin -C Release --output-on-failure
      - name: "Collect the plugins (each generator puts them elsewhere)"
        shell: bash
        run: |
          d=build/plugin/dist; mkdir -p $d
          o=build/plugin/out
          first() { find "$o" -name "$1" $2 -prune -print | head -1; }
          for x in "$(first '*.clap')" "$(first '*.vst3' '-type d')" "$(first '*.component')" "$(first '*.app')"; do
            [ -n "$x" ] && cp -R "$x" $d/
          done
          if [ "$RUNNER_OS" != "macOS" ]; then             # (the standalone: macOS's is the .app)
            x=$(find "$o" -type f \( -name 'ATLATL FM-1' -o -name 'ATLATL FM-1.exe' \) -not -path '*/Contents/*' | head -1)
            [ -n "$x" ] && cp "$x" $d/
          fi
          ls -la $d
      - name: "macOS: sign (ad hoc)"
        if: runner.os == 'macOS'
        run: |
          cd build/plugin/dist
          for b in *.clap *.vst3 *.component *.app; do [ -e "$b" ] && codesign --force --deep --sign - "$b"; done
          ls -la
      - name: clap-validator
        shell: bash
        run: |
          cargo install --locked --git https://github.com/free-audio/clap-validator clap-validator
          clap=$(ls -d build/plugin/dist/*.clap | head -1)
          clap-validator validate --hide-output "$clap"
      - name: pluginval (VST3)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) z=pluginval_Linux.zip; exe=./pluginval ;;
            macOS) z=pluginval_macOS.zip; exe=./pluginval.app/Contents/MacOS/pluginval ;;
            Windows) z=pluginval_Windows.zip; exe=./pluginval.exe ;;
          esac
          curl -sSfL -o pv.zip "https://github.com/Tracktion/pluginval/releases/latest/download/$z"
          unzip -q pv.zip
          vst3=$(ls -d build/plugin/dist/*.vst3 | head -1)
          run=""; [ "$RUNNER_OS" = "Linux" ] && run="xvfb-run -a"
          $run $exe --strictness-level 5 --skip-gui-tests --validate-in-process --validate "$vst3"
      - name: auval (AU)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/plugin/dist/*.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aumu Fm1s Atlt
      - name: "Linux: the window (Xvfb)"
        if: runner.os == 'Linux'
        run: |
          g++ -std=c++20 -O1 -Ibuild/plugin/_deps/clap-src/include -o gui_smoke plugin/tests/gui_smoke.cpp -ldl
          Xvfb :99 -screen 0 1400x900x24 & sleep 1
          DISPLAY=:99 ./gui_smoke "$(ls build/plugin/dist/*.clap | head -1)" 10 & sleep 8
          DISPLAY=:99 import -window root -crop 1280x840+0+0 build/plugin/dist/window-linux.png
          wait %2
      - name: Package
        shell: bash
        run: |
          rm -f build/plugin/dist/window-linux.png       # (the look at the window: not shipped)
          cd build/plugin/dist
          cp ../../../plugin/README.md README-plugin.md
          7z a -tzip "../fm1-plugin-${{ matrix.name }}.zip" . >/dev/null
      - name: "Installer: its version (the release's tag, or dev)"
        id: ver
        shell: bash
        env:
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          v=dev
          case "$GITHUB_REF_TYPE:$TAG" in tag:[vV]*) v="${TAG#[vV]}";; esac
          [ -n "${{ inputs.release }}" ] && v="${TAG#[vV]}"
          echo "v=$v" >> "$GITHUB_OUTPUT"
          mkdir -p build/plugin/installer
      - name: "Installer (macOS): a .pkg, the plugins into /Library/Audio/Plug-Ins, the app into /Applications"
        if: runner.os == 'macOS'
        run: |
          r=build/plugin/pkgroot
          mkdir -p "$r/Library/Audio/Plug-Ins/CLAP" "$r/Library/Audio/Plug-Ins/VST3" "$r/Library/Audio/Plug-Ins/Components" "$r/Applications"
          d=build/plugin/dist
          cp -R "$d"/*.clap "$r/Library/Audio/Plug-Ins/CLAP/"
          cp -R "$d"/*.vst3 "$r/Library/Audio/Plug-Ins/VST3/"
          cp -R "$d"/*.component "$r/Library/Audio/Plug-Ins/Components/"
          cp -R "$d"/*.app "$r/Applications/"
          mkdir -p build/plugin/scripts
          printf '#!/bin/sh\nkillall -9 AudioComponentRegistrar 2>/dev/null || true\nexit 0\n' > build/plugin/scripts/postinstall
          chmod +x build/plugin/scripts/postinstall
          pkgbuild --root "$r" --identifier io.github.likst4.skiff-atlatl.fm1.pkg --version "${{ steps.ver.outputs.v }}" \
            --install-location / --scripts build/plugin/scripts \
            "build/plugin/installer/ATLATL-FM-1-plugin-${{ steps.ver.outputs.v }}-macos.pkg"
          ls -la build/plugin/installer
      - name: "Installer (Windows): a setup .exe (Inno Setup), CLAP and VST3 into Common Files, the app into Program Files"
        if: runner.os == 'Windows'
        shell: bash
        run: |
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -x "$iscc" ] || { choco install innosetup -y --no-progress >/dev/null; }
          v="${{ steps.ver.outputs.v }}"
          vst3=$(cd build/plugin/dist && ls -d *.vst3 | head -1)
          clap=$(cd build/plugin/dist && ls *.clap | head -1)
          cat > build/plugin/setup.iss <<'ISS'
          [Setup]
          AppName=ATLATL FM-1
          AppVersion=@V@
          AppPublisher=skiff-atlatl
          AppPublisherURL=https://github.com/LIkst4/skiff-atlatl
          DefaultDirName={autopf}\ATLATL FM-1
          DefaultGroupName=ATLATL FM-1
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=admin
          OutputDir=installer
          OutputBaseFilename=ATLATL-FM-1-plugin-@V@-windows-setup
          LicenseFile=..\..\LICENSE
          Compression=lzma2
          SolidCompression=yes
          [Files]
          Source: "dist\@CLAP@"; DestDir: "{commoncf64}\CLAP"; Flags: ignoreversion
          Source: "dist\@VST3@\*"; DestDir: "{commoncf64}\VST3\@VST3@"; Flags: ignoreversion recursesubdirs createallsubdirs
          Source: "dist\ATLATL FM-1.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "dist\README-plugin.md"; DestDir: "{app}"; Flags: ignoreversion
          [Icons]
          Name: "{group}\ATLATL FM-1"; Filename: "{app}\ATLATL FM-1.exe"
          Name: "{group}\Uninstall ATLATL FM-1"; Filename: "{uninstallexe}"
          ISS
          sed -i -e "s/@V@/$v/g" -e "s/@CLAP@/$clap/g" -e "s/@VST3@/$vst3/g" build/plugin/setup.iss
          cat build/plugin/setup.iss
          "$iscc" //Q build/plugin/setup.iss
          ls -la build/plugin/installer
      - name: "Installer (Linux): a .tar.gz with install.sh (into ~/.clap, ~/.vst3, ~/.local/bin)"
        if: runner.os == 'Linux'
        run: |
          v="${{ steps.ver.outputs.v }}"
          n="ATLATL-FM-1-plugin-$v-linux"
          t=build/plugin/$n
          mkdir -p "$t"
          cp -R build/plugin/dist/. "$t/"
          cat > "$t/install.sh" <<'SH'
          #!/bin/sh
          # ATLATL FM-1: the CLAP into ~/.clap, the VST3 into ~/.vst3, the standalone into ~/.local/bin (no root needed)
          set -e
          d=$(cd "$(dirname "$0")" && pwd)
          mkdir -p "$HOME/.clap" "$HOME/.vst3" "$HOME/.local/bin"
          cp -R "$d"/*.clap "$HOME/.clap/"
          cp -R "$d"/*.vst3 "$HOME/.vst3/"
          cp "$d/ATLATL FM-1" "$HOME/.local/bin/atlatl-fm1"
          chmod +x "$HOME/.local/bin/atlatl-fm1"
          echo "ATLATL FM-1 installed: ~/.clap, ~/.vst3, ~/.local/bin/atlatl-fm1 (needs GTK 3 and WebKitGTK 4.1)"
          SH
          chmod +x "$t/install.sh"
          tar -C build/plugin -czf "build/plugin/installer/$n.tar.gz" "$n"
          ls -la build/plugin/installer
      - name: "Installer: the zip beside it, named for the release"
        shell: bash
        run: cp "build/plugin/fm1-plugin-${{ matrix.name }}.zip" "build/plugin/installer/ATLATL-FM-1-plugin-${{ steps.ver.outputs.v }}-${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: fm1-plugin-${{ matrix.name }}
          path: build/plugin/installer/*
  release:
    # (custom) a release's tag: its installers and zips onto that release (made by build.yml, or by hand on GitHub)
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && inputs.release != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fm1-plugin-*
          merge-multiple: true
          path: out
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          ls -la out
          for i in $(seq 1 30); do gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break; sleep 20; done
          gh release upload "$TAG" out/* --clobber -R "$GITHUB_REPOSITORY"
