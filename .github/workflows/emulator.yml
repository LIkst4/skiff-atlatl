# SPDX-License-Identifier: GPL-3.0-only
# (custom) Boot this branch's package in Simon Johansson's FM-1 emulator (https://github.com/simonjohansson/fm1-emulator,
# GPL-2.0-or-later, QEMU; its released Linux binary) headless: the stress run (random buttons, keys and knobs, then a
# held key must sound) and the panel smoke (presets, every function button). The package is build.yml's emulator
# variant (skiff-atlatl-emu.fwsc: built with -fno-optimize-sibling-calls): the emulator refuses a GOTO ending an IF's
# THEN arm when an ELSE follows, which clang emits for tail calls (Skiff's rev_model) and the hardware runs.
name: emulator
on:
  workflow_dispatch:
  push:
permissions:
  contents: read
concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true
env:
  EMU_REPO: simonjohansson/fm1-emulator
  EMU_REF: 519a13b879d744f5c05bfe3c4e5d4e04d8d4ae34
jobs:
  emulator:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: "The emulator (its tools pinned, its released binary)"
        run: |
          git clone https://github.com/$EMU_REPO emu
          git -C emu checkout $EMU_REF
          curl --fail --location --retry 3 \
            https://github.com/$EMU_REPO/releases/latest/download/fm1-emulator-linux-amd64.tar.gz | tar -xz -C emu emulator
      - uses: jdx/mise-action@v2
        with:
          working_directory: emu
          install_args: python
      - name: "This branch's package (this commit's - waits for build.yml to publish it)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_REF_NAME//\//-}"
          for i in $(seq 1 60); do
            sha=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" -q .body 2>/dev/null | grep -o 'from [0-9a-f]*' | cut -c6-)
            [ "$sha" = "${GITHUB_SHA::7}" ] && break
            echo "waiting for $tag of ${GITHUB_SHA::7} (now: $sha)"; sleep 30
          done
          curl --fail --location --retry 3 -o emu/fw.fwsc \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/skiff-atlatl-emu.fwsc"
      - name: "Stress (60 guest seconds of random input)"
        working-directory: emu
        run: mise run stress -- fw.fwsc --seconds 60 --seed 1
      - name: "Panel smoke (presets, function buttons)"
        if: always()
        working-directory: emu
        run: mise run panel_smoke -- fw.fwsc --presets 64
