# SPDX-License-Identifier: GPL-3.0-only
# Build the firmware package (.fwsc) and run the host tests on every push; the package is an artifact of the run.
name: build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "(custom) the tag of a release made on GitHub (vX.Y or VX.Y): build it and attach its package"
        required: false
        default: ""
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write             # (custom) the package as a pre-release of the branch (below)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python packages
        run: pip install Pillow fonttools mido
      - name: "JieLi toolchain (pi32v2 clang 4.0.1)"
        run: |
          sh tools/get_toolchain.sh "$HOME/.jieli"
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"
      - name: "JieLi AC79 SDK (Apache-2.0, three of its files go into the package)"
        run: |
          for a in 1 2 3 4 5; do
            rm -rf "$HOME/fw-AC79_AIoT_SDK"
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK" && break
            [ "$a" = 5 ] && exit 1
            echo "clone failed (try $a), retrying"; sleep $((a * 15))
          done
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"
      - name: "(custom) Build the emulator's variant first (no sibling calls: the FM-1 emulator takes no GOTO ending THEN)"
        continue-on-error: true
        run: |
          # (Skiff 2.5 on the fork: no sibling calls cost ~10 KB of flash the image no longer has; this variant is the
          # emulator's stress test only, so it goes without GRAIN's built-in FLUTE and SAX, 40 KB)
          # (2.5 starts the FM-1 on 2 CORES; the emulator runs one core: icfg in core 1's entry stops it. FELUCCA_ONE_CORE:
          # 1 CORE by default, the second core built as on the unit)
          FELUCCA_BUILTIN_SAMPLES=0 FELUCCA_EXTRA_CFLAGS="-fno-optimize-sibling-calls -DFELUCCA_ONE_CORE=1" ./build.sh
          cp build/felucca.fwsc "$RUNNER_TEMP/skiff-atlatl-emu.fwsc"
          python tools/emu_gaps.py build/felucca.dis || true
      - name: Build
        run: ./build.sh
      - name: "(custom) Emscripten, for the browser emulator"
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10
      - name: "(custom) The browser emulator (web/emu: the firmware's sources in WebAssembly) as a site"
        continue-on-error: true
        run: |
          EMU_PREVIEW=0 sh web/emu/build.sh
          mkdir -p site
          cp -r build/emu site/emu
          cp build/panel.js site/
          mkdir -p site/editor/conv
          cp web/editor.html site/editor/index.html
          cp docs/logo/atlatl-favicon-32.png site/favicon.png          # (custom) the logo: favicons, the landing page
          cp docs/logo/atlatl-logo.svg site/logo.svg
          sed -i 's#<head>#<head><link rel="icon" type="image/png" href="../favicon.png">#' site/editor/index.html
          cp -r web/fonts web/fukiai.ttf web/FUKIAI-LICENSE.txt web/fm1backup.js site/editor/
          cp web/conv/conv.js site/editor/conv/
          sh web/conv/build.sh && cp build/conv/conv.wasm site/editor/conv/ || echo "no converter (the editor's Restore of pre-2.0 backups)"
          python web/make_installer.py build/felucca.fwsc "2.2 · atlatl-dev ${GITHUB_SHA::7}" site
          printf '%s\n' '<!DOCTYPE html><meta charset="utf-8"><meta name="viewport" content="width=device-width">' \
            '<title>skiff-atlatl</title><link rel="icon" type="image/png" href="favicon.png">' \
            '<style>body{font:16px system-ui;max-width:640px;margin:40px auto;padding:0 16px;background:#07070d;color:#e6e6ee}' \
            'a{color:#00f5d4}a:hover{color:#39ff14}img{max-width:100%}</style>' \
            '<h1><img src="logo.svg" alt="skiff-atlatl" width="560"></h1><p>A groovebox firmware for the M-VAVE FM-1 (a fork of Skiff).</p>' \
            '<ul><li><a href="installer/"><b>Install it</b></a> (Chrome or Edge, the FM-1 on USB; also the way back to the official firmware)</li>' \
            '<li><a href="emu/">Play it in the browser</a> (the firmware itself, emulated)</li>' \
            '<li><a href="editor/">Web editor</a> (Chrome or Edge, the FM-1 on USB): sounds, steps, ARP STEP, the screen</li>' \
            '<li><a href="https://github.com/LIkst4/skiff-atlatl">Source and releases</a></li></ul>' > site/index.html
      - name: "(custom) The site as the Pages artifact"
        if: github.event_name == 'push' && github.ref_name == 'atlatl-dev' && hashFiles('site/emu/felucca.wasm') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: "(custom) The package as the branch's pre-release (build-<branch>: a stable download link)"
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_REF_NAME//\//-}"
          notes="Built by CI from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Not tested on a real FM-1: back up first."
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --prerelease --target "$GITHUB_SHA" --title "$tag" --notes "$notes"
          gh release edit "$tag" --notes "$notes"
          cp build/felucca.fwsc build/skiff-atlatl.fwsc
          gzip -9 -c build/felucca.dis > build/felucca.dis.gz   # (the disassembly: an emulator's PC to its function)
          gh release upload "$tag" build/skiff-atlatl.fwsc build/felucca.dis.gz --clobber
          if [ -f "$RUNNER_TEMP/skiff-atlatl-emu.fwsc" ]; then
            gh release upload "$tag" "$RUNNER_TEMP/skiff-atlatl-emu.fwsc" --clobber
          fi
      - name: "Size report (on a failed build: the biggest symbols of the app's object)"
        if: failure()
        run: |
          find "$JIELI_TOOLCHAIN/" -name "*nm" | head
          NM=$(find "$JIELI_TOOLCHAIN/" -name "*nm" -type f | head -1); NM=${NM:-nm}
          "$NM" --size-sort -S -t d build/felucca.o | grep -v " [bB] " || true
          echo "(custom) the biggest .bss (main RAM) symbols:"
          "$NM" --size-sort -S -t d build/felucca.o | grep " [bB] " | tail -40 || true
          "$NM" --size-sort -S -t d build/felucca.o | awk '{s+=$2} END {print "total symbol bytes", s}' || true
      - name: Host tests
        run: SANITIZE=0 sh tests/run_tests.sh
      - name: "(custom) A tag vX.Y: the release build (identity FM-1_742XY) as that tag's release, its source the tag's"
        if: >-
          (github.event_name == 'push' && github.ref_type == 'tag' &&
           (startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'V'))) ||
          (github.event_name == 'workflow_dispatch' && inputs.release != '')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          GITHUB_REF_NAME="$TAG"                      # (a tag, or the release asked for by hand)
          ver="${TAG#[vV]}"
          ./build.sh --release "$ver"
          cp "build/skiff-$ver.fwsc" "build/skiff-atlatl-v$ver.fwsc"
          pre=""; case "$ver" in 0.*|*-*) pre="--prerelease";; esac
          ident="FM-1_742$(echo "$ver" | cut -d- -f1 | cut -d. -f1-2 | tr -d .)"
          notes="skiff-atlatl $GITHUB_REF_NAME (identity $ident), built by CI from ${GITHUB_SHA::7}: a six-track groovebox firmware for the M-VAVE FM-1, forked from Skiff. Install skiff-atlatl-v$ver.fwsc with a firmware installer (Chrome or Edge, the FM-1 on USB) or the FM-1's update (M-UPGRADE). Back up first: the package carries the update loader, so the unit can always go back to the official firmware. What it does, the credits and the licences: README.md and LICENSING.md; the performance guide: docs/PERFORMANCE.md (docs/PERFORMANCE.es.md en español)."
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" $pre --verify-tag --title "skiff-atlatl $GITHUB_REF_NAME" --notes "$notes"
          gh release upload "$GITHUB_REF_NAME" "build/skiff-atlatl-v$ver.fwsc" --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware
          path: |
            build/felucca.fwsc
            build/felucca.bin
            build/felucca.dis
            build/flt_demo/*.wav
          if-no-files-found: warn
  pages:
    # (custom) the browser emulator on GitHub Pages (the repository's Settings > Pages > Source: GitHub Actions)
    needs: build
    if: github.event_name == 'push' && github.ref_name == 'atlatl-dev'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
