# SPDX-License-Identifier: GPL-3.0-only
# Build the firmware package (.fwsc) and run the host tests on every push; the package is an artifact of the run.
name: build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write             # (custom) the package as a pre-release of the branch (below)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python packages
        run: pip install Pillow fonttools mido
      - name: "JieLi toolchain (pi32v2 clang 4.0.1)"
        run: |
          sh tools/get_toolchain.sh "$HOME/.jieli"
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"
      - name: "JieLi AC79 SDK (Apache-2.0, three of its files go into the package)"
        run: |
          for a in 1 2 3 4 5; do
            rm -rf "$HOME/fw-AC79_AIoT_SDK"
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK" && break
            [ "$a" = 5 ] && exit 1
            echo "clone failed (try $a), retrying"; sleep $((a * 15))
          done
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"
      - name: "(custom) Build the emulator's variant first (no sibling calls: the FM-1 emulator takes no GOTO ending THEN)"
        continue-on-error: true
        run: |
          FELUCCA_EXTRA_CFLAGS="-fno-optimize-sibling-calls" ./build.sh
          cp build/felucca.fwsc "$RUNNER_TEMP/skiff-atlatl-emu.fwsc"
      - name: Build
        run: ./build.sh
      - name: "(custom) The package as the branch's pre-release (build-<branch>: a stable download link)"
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_REF_NAME//\//-}"
          notes="Built by CI from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Not tested on a real FM-1: back up first."
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --prerelease --target "$GITHUB_SHA" --title "$tag" --notes "$notes"
          gh release edit "$tag" --notes "$notes"
          cp build/felucca.fwsc build/skiff-atlatl.fwsc
          gzip -9 -c build/felucca.dis > build/felucca.dis.gz   # (the disassembly: an emulator's PC to its function)
          gh release upload "$tag" build/skiff-atlatl.fwsc build/felucca.dis.gz --clobber
          if [ -f "$RUNNER_TEMP/skiff-atlatl-emu.fwsc" ]; then
            gh release upload "$tag" "$RUNNER_TEMP/skiff-atlatl-emu.fwsc" --clobber
          fi
      - name: "Size report (on a failed build: the biggest symbols of the app's object)"
        if: failure()
        run: |
          find "$JIELI_TOOLCHAIN/" -name "*nm" | head
          NM=$(find "$JIELI_TOOLCHAIN/" -name "*nm" -type f | head -1); NM=${NM:-nm}
          "$NM" --size-sort -S -t d build/felucca.o | grep -v " [bB] " || true
          "$NM" --size-sort -S -t d build/felucca.o | awk '{s+=$2} END {print "total symbol bytes", s}' || true
      - name: Host tests
        run: SANITIZE=0 sh tests/run_tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware
          path: |
            build/felucca.fwsc
            build/felucca.bin
            build/felucca.dis
            build/flt_demo/*.wav
          if-no-files-found: warn
